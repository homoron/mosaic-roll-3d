<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9b5434">
  <meta name="description" content="Juega a Mosaic Roll 3D. Combina dados de cerámica, compra azulejos y forja quimeras entre mosaicos.">
  <title>Mosaic Roll 3D</title>
  <link rel="icon" type="image/jpeg" href="azulejo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,500..800,0..100,0..1;1,9..144,500..700,0..100,0..1&family=Alegreya+Sans:ital,wght@0,500;0,700;0,800;1,500&display=swap">
  <link rel="stylesheet" href="estilo.css?v=mediterranean-revamp-6">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
  <script type="module" src="juego.js?v=ceramica-2"></script>
  <script type="module" src="tooltip.js?v=ceramica-4"></script>
</head>
<body>
  <main class="start" id="start">
    <div class="start-bg" aria-hidden="true"><span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span><span class="spark s5"></span></div>
    <div class="start-content">
      <h1 class="logo"><span class="logo-top">Mosaic</span><span class="logo-bottom">Roll 3D</span></h1>
      <p class="tagline">Combina dados de cerámica y mejora tu bolsa en el taller.</p>
      <div class="start-actions">
        <button class="button primary big" type="button" id="play" disabled>Cargando…</button>
        <button class="button" type="button" id="new" hidden>Nueva partida</button>
        <div class="start-row">
          <button class="button quiet" type="button" data-help><i class="ico i-help" aria-hidden="true"></i>Cómo jugar</button>
          <button class="button quiet" type="button" id="catalog"><i class="ico i-book" aria-hidden="true"></i>Catálogo</button>
        </div>
      </div>
      <p class="boot" id="boot" role="status" hidden></p>
      <a class="download" href="Mosaic-Roll-3D.zip?v=taller-2" download><i class="ico i-download" aria-hidden="true"></i>Descargar edición Windows</a>
    </div>
  </main>

  <main class="game" id="game" hidden>
    <header class="game-header">
      <button class="button icon-button" type="button" id="pause" aria-label="Pausa"><i class="ico i-pause" aria-hidden="true"></i></button>
      <div class="ribbon stage"><span class="stage-label" id="stage-label"></span><h1 id="stage-name"></h1></div>
      <button class="button icon-button sound-button" type="button" id="sound" aria-label="Sonido" aria-pressed="true"><i class="ico i-sound" aria-hidden="true"></i></button>
    </header>

    <div class="resource-bar" id="resources">
      <div class="res res-score" id="score-pill">
        <span class="badge b-star" aria-hidden="true"><i class="ico i-star"></i></span>
        <div class="res-body">
          <div class="res-value"><span class="sr-only">Puntuación</span><strong id="score">0</strong><span id="goal"></span></div>
          <progress id="progress" value="0" aria-label="Objetivo del mosaico"></progress>
        </div>
      </div>
      <div class="res" title="Turnos restantes">
        <span class="badge b-turns" aria-hidden="true"><i class="ico i-turns"></i></span>
        <div class="turns" id="turns" role="img"></div>
      </div>
      <div class="res" title="Cargas de cincel">
        <span class="badge b-chisel" aria-hidden="true"><i class="ico i-chisel"></i></span>
        <span class="sr-only">Cincel</span><strong id="chisel-count"></strong>
      </div>
      <div class="res res-gold" title="Oro">
        <i class="coin big" aria-hidden="true"></i>
        <span class="sr-only">Oro</span><strong id="gold-count"></strong>
      </div>
      <div class="res res-bag" title="Dados en la bolsa">
        <span class="badge b-dice" aria-hidden="true"><i class="ico i-dice"></i></span>
        <span class="sr-only">Dados en la bolsa</span><strong id="bag-count"></strong>
      </div>
    </div>

    <input type="checkbox" id="patterns-toggle" class="patterns-toggle" hidden aria-hidden="true">
    <label for="patterns-toggle" class="patterns-backdrop" aria-hidden="true"></label>
    <div class="layout" id="play-layout">
      <section class="play-area" aria-label="Mesa 3D">
        <div class="world" id="world">
          <canvas id="canvas" tabindex="0" aria-label="Tablero de dados 3D" aria-describedby="hint"></canvas>
          <div class="world-labels" id="world-labels" aria-hidden="true"></div>
          <div class="popups" id="popups" aria-hidden="true"></div>
          <div class="order" id="order" hidden>
            <span class="badge b-quest" aria-hidden="true"><i class="ico i-quest"></i></span>
            <div><span class="order-kicker">Encargo</span><strong id="order-label"></strong></div>
            <span class="order-reward" id="order-reward"></span>
          </div>
          <div class="power-tooltip" id="power-tooltip" role="tooltip" hidden></div>
          <div class="power-tooltip unique-tooltip" id="die-tooltip" role="tooltip" hidden></div>
          <div class="score-sequence" id="sequence" hidden>
            <span class="sequence-phase" id="sequence-phase"></span>
            <div class="sequence-value" id="sequence-value"></div>
            <small class="sequence-detail" id="sequence-detail"></small>
            <button class="button quiet small" id="skip-score" type="button">Saltar <i class="ico i-forward" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="table-controls">
          <p class="hint" id="hint" aria-live="polite"></p>
          <button class="button small" type="button" id="recall" hidden><i class="ico i-undo" aria-hidden="true"></i>Retirar</button>
          <button class="button icon-button small quiet" type="button" id="top" aria-label="Vista cenital" title="Vista cenital (V)" hidden aria-hidden="true"></button>
          <button class="button icon-button small quiet" type="button" id="reset-camera" aria-label="Centrar cámara" title="Centrar cámara (R)" hidden aria-hidden="true"></button>
          <button class="button icon-button small quiet" type="button" id="collection-button" aria-label="Bolsa y azulejos" title="Bolsa y azulejos"><i class="ico i-bag" aria-hidden="true"></i></button>
          <label for="patterns-toggle" class="button icon-button small quiet patterns-toggle-btn" aria-label="Ver combinaciones" title="Combinaciones"><i class="ico i-book" aria-hidden="true"></i></label>
        </div>
      </section>

      <aside class="hud" aria-label="Puntuación y combinaciones">
        <section class="panel play-total" aria-live="polite">
          <h2 class="panel-title">Jugada</h2>
          <strong class="preview" id="preview">+0</strong>
          <p class="breakdown" id="breakdown"></p>
          <p class="placement" id="placed"></p>
          <button class="button primary big confirm" id="confirm" type="button" disabled>Puntuar <kbd>Espacio</kbd></button>
        </section>
        <section class="panel equipped-rail" id="equipped-rail">
          <h2 class="panel-title" id="equipped-label">Azulejos <span class="panel-count" id="equipped-count"></span></h2>
          <div class="active-powers" id="active-powers" role="group" aria-labelledby="equipped-label"></div>
        </section>
        <section class="panel patterns">
          <div class="patterns-header">
            <h2 class="panel-title">Combinaciones</h2>
            <label for="patterns-toggle" class="patterns-close-btn" aria-label="Cerrar"><i class="ico i-close" aria-hidden="true"></i></label>
          </div>
          <ul id="patterns"></ul>
        </section>
        <p class="key-tip"><kbd>Clic der.</kbd> girar · <kbd>Rueda</kbd> zoom · <kbd>1–4</kbd> elegir · <kbd>Espacio</kbd> puntuar</p>
      </aside>

      <div class="mobile-actions">
        <button class="button primary big" type="button" id="mobile-confirm" disabled>Puntuar <strong id="mobile-points">+0</strong></button>
      </div>
    </div>
    <section class="workshop-view" id="workshop" aria-labelledby="workshop-title" hidden></section>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript>Activa JavaScript en el navegador para jugar a Mosaic Roll 3D.</noscript>
</body>
</html>
